; stellaris-engine-fixes settings. Read when Stellaris starts; restart the game after a change.

[interface]
; Alt-click the amount or its + or - button in empire deals and monthly market trades to type an amount.
trade_amount_entry=1
; Ctrl-click to put new planet construction at the front of its queue. Single player only.
planet_queue_first=1

[mimalloc]
; 1: the game allocates its memory with mimalloc instead of the Windows heap.
; 0: the game's own heap, as without stellaris-engine-fixes.
enabled=1

; GiB of RAM to reserve as 1 GiB pages when the game starts, for the game's allocations
; (falls back to 2 MiB pages). 0: off.
; Needs the "Lock pages in memory" right for your Windows user: secpol.msc, Local Policies,
; User Rights Assignment, add yourself, then restart Windows. Reserved pages stay with the game
; until it exits, so keep this below your free RAM (about 4 with 16 GB, 4 to 8 with 32 GB).
; Windows needs long runs of unbroken memory, which it rarely has hours after a restart: start
; the game soon after restarting Windows. stellaris-engine-fixes.log says how much it got; with too little
; the game uses normal pages for the rest, which is harmless.
reserve_huge_os_pages=0

; Any other mimalloc option, by its name without MIMALLOC_
; (https://microsoft.github.io/mimalloc/environment.html). An environment variable of the same
; name, if set, wins over the line here.
; 1: also use 2 MiB large pages for everything else (needs the same right). This has no effect
; unless arena_eager_commit below is 1 or 2.
allow_large_os_pages=0
; 0: commit memory as the game uses it (mimalloc's default on Windows). 1 commits each arena
; whole up front: in a 4.5.2 game that was 16 GB committed for 7 GB in use, which counts
; against RAM + page file and can run out with a small page file. Pages reserved with
; reserve_huge_os_pages are committed whole either way.
arena_eager_commit=0
; Give freed memory back to Windows after 10 s (LargePageInjectorMods' default).
purge_delay=10000

[speed]
; How often the game may draw a frame while it simulates. During a long game day (the first of a
; month can take most of a second) the game draws frames from inside the simulation so the screen
; keeps moving: by default whenever your refresh rate's interval has passed, about every 11 ms at
; 90 Hz. Each costs as much as a normal frame. Here at most one per this many ms; 33 is about
; 30 per second. 0: the game's own rate. Larger is faster but choppier during long days.
in_tick_frame_ms=33
; 1: at the fastest speed, the game runs a day's 10 ticks in 2 frames instead of 5 (it normally
; runs 2 ticks per frame). Batches end at the AI's tick and at the day's tick, so the AI's and
; the day's commands still take effect before the next tick, as in the game. Single player only.
; 0: the game's 2 ticks per frame.
batch_ticks=1
; 1: fleet automation's pathfinding gets each answer to "how well can this empire detect that
; empire's cloaked fleets here" from a table built once per search, instead of the game scanning
; two lists for every fleet in every system it passes. Same answers; measured gain small. 0: off.
fast_intel_lookup=1
; 1: also run the game's own lookup every time, use the game's answer, and write any difference
; to stellaris-engine-fixes.log (slower than off; for checking). 0: no check.
fast_intel_verify=0
; 1: every tick the game records each fleet's combat participants in a table, even for the many
; fleets not in combat, whose record is empty. A missing record already reads as empty, so the
; empty ones are not stored. Same results, less work per tick. 0: off.
skip_empty_combat_entries=1
; 1: when an AI empire looks for a place to build a megastructure, it checks for every candidate
; system whether it can afford the megastructure; that answer doesn't depend on the system, so
; it is worked out once per search. Same results. 0: off.
mega_afford_cache=1
; 1: also run the game's check every time, use the game's answer, and write any difference to
; stellaris-engine-fixes.log (for checking). 0: no check.
mega_afford_verify=0
; 1: each AI month an AI empire sets its income targets by adding the income of its economic
; plan's "scaling" parts round after round until it passes a target, with no limit on the rounds.
; A very large economy can need a billion rounds, which freezes the game for half an hour (seen
; after switching to observe on a late-game save). Every round adds the same, so the number of
; rounds is worked out after the first instead. Same targets. 0: off.
fast_income_target=1
; 1: also let rounds 2 and 3 run and check they add what round 1 did, writing any difference to
; stellaris-engine-fixes.log (for checking). 0: no check.
income_target_verify=0
; 1: when the game looks for a file it tries every mod's folder in turn, and most of those fail
; because the folder doesn't exist in that mod. Those are answered from a listing of the mod's
; folders, read once, for a faster load. Same results. 0: off.
fast_file_lookups=1
; 1: also ask the file system every time, use its answer, and write any difference to
; stellaris-engine-fixes.log (for checking; no speed-up). 0: no check.
fast_file_lookups_verify=0
; 1: the game keeps a table of every script keyword's text, and refills all of it each time a new
; one appears while mods load. Only the new ones are added. Same table, faster load. 0: off.
fast_token_rebuild=1
; 1: also run the game's rebuild on every 16th call and write any difference to stellaris-engine-fixes.log
; (for checking; slower). 0: no check.
fast_token_rebuild_verify=0
; 1: every object the game destroys while loading searches a long list of references for entries
; of its own, and nearly all have none. Objects known to have none skip the search, for a faster
; load. Same results. 0: off.
fast_deferred_unregister=1
; 1: also check each skip against the list, and write any difference to stellaris-engine-fixes.log (for
; checking). 0: no check.
fast_deferred_unregister_verify=0
; 1: skip writing logs/script_documentation/modifiers.log, a list of modifiers for modders that
; takes seconds to write and nothing in the game reads. It stays empty. 0: write it.
skip_modifier_docs=1

[numeric_fixes]
; 1: exact recursive income-target sums and scaling counts, including optional scaling plans.
; Supersedes fast_income_target. Unreachable mixed-sign targets stop after one scaling round.
; Output saturates only at each returned resource table; no int32 or int64 round-count cap.
; Changes extreme/previously nonterminating gameplay results; all peers need this setting.
income_target_arithmetic=0
; Keep parallel income/category sums wide until joined reducers publish them.
; Covers both production passes, all atomic additions, reads, resets and drains.
income_production_arithmetic=0
; Keep forecast income + projected production - projected upkeep in a wide sum before
; narrowing; also protect forecast target differences. Does not replace parallel income production.
income_forecast_arithmetic=0
; 1: keep AddResource's whole-unit amount in 64 bits instead of wrapping above 2,147,483,647
; units (or below -2,147,483,648). Preserves fractional truncation and normal resource caps.
; Fixes both the stockpile input and the amount passed to related situations. Does not fix
; overflow in subsequent additions, resource conversion, income, diplomatic weight or fleet stats.
; Changes gameplay at extreme values; all multiplayer peers need the same DLL and setting.
; No save-format change; changed resource/situation results are saved normally. Not tested in game.
resource_amount_rounding=0
; 1: remove int32 narrowing in the binary-to-decimal fixed-point helper and the fleet/tech
; conversions in base diplomatic weight. Keeps existing fractional rounding and saturates
; only when the decimal result exceeds int64. Does not fix later weight multipliers or UI ints.
; Same multiplayer/save cautions as above. Not tested in game.
fixed_point_conversion=0
; 1: use wide fleet-power sums and health-ratio/product intermediates, saturating outputs
; to int64. Preserves fleet filters, ship lookup, cached power and the game's health rounding.
; Includes country totals, ship power formula, damage/component producers and design numeric caches.
fleet_power_arithmetic=0
; 1: checked signed fixed-point multiplication in CResourceTable::MultResource, with int64
; saturation after division. Inlined economic arithmetic and stockpile addition are unaffected.
; Both options change gameplay at extreme values; same multiplayer/save cautions as above.
resource_multiplication=0
; 1: checked single/batch stockpile addition/removal and resource conversion before normal capacity
; handling. Includes whole-unit rounding and INT64_MIN removal; keeps ordinary rounding.
; Changes saved gameplay results at extreme values; all multiplayer peers need this setting.
; A change for a resource outside the stockpile table is skipped and counted in the log, not
; passed to the game's code, which would write through it.
stockpile_arithmetic=0
; 1: keep military power above INT32_MAX in the engine's 64-bit SI localization path;
; fix six caller roundings and binary/decimal SI narrowing. Boss labels and color wrappers remain.
; Display only; ordinary values retain the original formatter. Not tested in game.
military_power_display=0
; 1: checked base/final diplomatic-weight multiplications, component/modifier totals,
; economic/technology score production, job weights and individual/total favor loans.
; Includes vote sums, federation AI decisions and wide diplomatic tooltip arguments.
; Includes fixed_point_conversion; retains exact cancellation before the final total.
; Saturates at int64 storage boundaries; retains the native final nonnegative clamp.
; Changes gameplay at extreme values; all multiplayer peers need the same setting.
diplomatic_weight_arithmetic=0
; 1: wide per-ship maximum hull/armor/shield modifiers and fleet aggregation.
; When a fleet current/maximum pair cannot
; fit, scale both together to preserve the health ratio; ordinary totals are unchanged.
; Hull queries calculate both totals to keep separate cache writes consistent.
; Changes extreme derived gameplay values; all multiplayer peers need the same setting.
fleet_stat_arithmetic=0

[script_storage]
; 1: Paradox script (mods) can keep data outside the game with log = "@sef:..." effects and
; triggers, in the sefdata folder in the game folder: a global store shared by every game, and a
; save store that follows the save game. Numbers from variables (global.set KEY = VARIABLE,
; global.get VARIABLE = KEY), script recorded from log lines and run later (global.record KEY ...
; record_end, global.run KEY), and global.has KEY as a trigger; save. instead of global for the
; save store. Nothing happens unless a mod uses it. 0: off.
enabled=1
; In multiplayer every machine has its own sefdata, so storage is off there (0). 1: the host sends
; its stores to every player when the game starts and when a player joins, and each player then
; uses that copy; only the host's files are read and written, and run does nothing. Every player
; needs this DLL with multiplayer=1: the setting is part of the game's checksum ([multiplayer]
; below), so others cannot join. Experimental: not yet run in a multiplayer game. Combined
; snapshots are limited to 1 MB; larger ones send an ordered disable to every player. Host
; migration, localized recordings and concurrent script writes are not supported; see re/multiplayer.md.
multiplayer=0

[ai_fixes]
; Fixes for places where the AI's code disagrees with itself or its defines (re/ai.md, section 2).
; Each changes how AI empires play, so each is off (0) unless set. None changes saves; they act on
; the AI only, so in multiplayer every player would need the same ones (untested).
; 1: the planet build plan the AI makes once a month lasts the month. The game uses it for one
; week, then deletes it, so AIs place planet buildings and districts one week in four. Items whose
; planet is already building something wait at the end of the plan instead of stopping it.
build_plan_keep=0
; 1: the "opportunist" personality trait ("more likely to attack someone already at war") counts
; the target's enemies in the target's wars. The game looks at the AI's own wars instead, so at
; peace the trait does nothing.
opportunist_wars=0
; 1: the war score's distance penalty counts the jumps above WAR_DECLARATION_MALUS_DISTANCE, as
; the define's comment says. The game multiplies the whole distance, so any target past it gets the
; minimum score.
war_distance_slope=0
; 1: check the game's declaration rules before preparing for war and while the plan is active.
; Cancelling a plan requests a military strategy refresh so the AI can target local hostiles again.
war_plan_check=0
; 1: count hostile bosses at their cached fleet power when it exceeds BOSS_MILITARY_POWER.
boss_threat_floor=0
; N: a truce with any country divides the AI's chance of preparing a war by N. The game divides by
; AI_AGGRESSIVENESS_BOXED_IN_MULT (4), a define meant for something else. 0: the game's.
truce_war_divisor=0
; 1: the AI's lists of systems to colonize, explore and claim are rebuilt every month, as in the
; first 15 years. The game rebuilds them once a year after that, so conquered systems go unnoticed
; for months and an AI that can no longer expand isn't treated as boxed in.
expansion_refresh_monthly=0
; 1: each AI's weekly, monthly and yearly updates fall on fixed days of the calendar, spread
; evenly. The game counts from the moment the AI object is created, so every load moves them, and
; two sevenths of the AIs' weekly updates share one day.
ai_schedule_from_date=0
; 1: a loaded AI continues the random stream saved with it. The game restarts it at the country's
; id unless started with -loadrandomseed (which also restores the game's own random). The log says
; how many AIs continue a saved stream on the first day after a load.
ai_random_from_save=0
; 1: the weekly walk over the planet build plan passes over an item it can't order (not
; affordable, planet busy) and goes on to the next. The game stops at the first such item, so one
; expensive item at the top holds up everything below it. The AI then buys cheaper items instead
; of saving for the heaviest one.
build_plan_skip_unaffordable=0
; N: a colony ship that has been idle for N days no longer stops the AI building another. The
; game builds no colony ship while any is idle, so one ship that can't reach a target blocks
; colonizing for good. The game's cap stays (ships plus queued ships below the number of targets),
; so a few idle ships can collect. 0: the game's. Suggested: 180.
colonizer_idle_days=0
; N: a construction ship that found no work for N days searches with half the distance penalty
; (CONSTRUCTION_SHIP_DISTANCE_PENALTY per jump), and from 2N days with none, until it has work.
; It still only considers the systems on the AI's own lists. 0: the game's. Suggested: 60.
constructor_idle_days=0
; 1: the list of systems the AI's science ships couldn't survey (a hostile fleet seen there, no
; clear path) is emptied every month. The game empties it once a year, so a system guarded for a
; week waits up to a year, also when the AI has intel on it and could see the fleet has left.
; Applies to every listed system, with or without intel; each is tested again once a month.
survey_blacklist_monthly=0

[diagnostics]
; Set both to decimal IDs from the save to trace one AI country's fleet decisions for one system.
; The trace writes target discovery, required power and fleet assignment to stellaris-engine-fixes.log.
; -1 disables the trace.
ai_fleet_country=-1
ai_fleet_system=-1

[multiplayer]
; 1: every setting of [numeric_fixes] and [ai_fixes] that is on (not 0) and changes what the game
; or the AI does becomes part of the game's checksum, the four characters after the version number
; in the main menu. Multiplayer only lets players with the same checksum play together, as with
; mods, so everyone in a game then has the same of these settings; without that the players could
; go out of sync, or the AI would change with the host. With none of them on the checksum is the
; game's own and players without stellaris-engine-fixes can join. A changed checksum also turns
; achievements off, as a mod does. stellaris-engine-fixes.log names the settings counted.
; 0: the checksum is always the game's own.
settings_in_checksum=1
