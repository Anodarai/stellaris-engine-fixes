; stellaris-engine-fixes settings. Read when Stellaris starts; restart the game after a change.

[mimalloc]
; 1: the game allocates its memory with mimalloc instead of the Windows heap.
; 0: the game's own heap, as without stellaris-engine-fixes.
enabled=1

; GiB of RAM to reserve as 1 GiB pages when the game starts, for the game's allocations
; (falls back to 2 MiB pages). 0: off.
; Needs the "Lock pages in memory" right for your Windows user: secpol.msc, Local Policies,
; User Rights Assignment, add yourself, then restart Windows. Reserved pages stay with the game
; until it exits, so keep this below your free RAM (about 4 with 16 GB, 4 to 8 with 32 GB).
; Windows needs long runs of unbroken memory, which it rarely has hours after a restart: start
; the game soon after restarting Windows. stellaris-engine-fixes.log says how much it got; with too little
; the game uses normal pages for the rest, which is harmless.
reserve_huge_os_pages=0

; Any other mimalloc option, by its name without MIMALLOC_
; (https://microsoft.github.io/mimalloc/environment.html). An environment variable of the same
; name, if set, wins over the line here.
; 1: also use 2 MiB large pages for everything else (needs the same right). This has no effect
; unless arena_eager_commit below is 1 or 2.
allow_large_os_pages=0
; 0: commit memory as the game uses it (mimalloc's default on Windows). 1 commits each arena
; whole up front: in a 4.5.2 game that was 16 GB committed for 7 GB in use, which counts
; against RAM + page file and can run out with a small page file. Pages reserved with
; reserve_huge_os_pages are committed whole either way.
arena_eager_commit=0
; Give freed memory back to Windows after 10 s (LargePageInjectorMods' default).
purge_delay=10000

[speed]
; How often the game may draw a frame while it simulates. During a long game day (the first of a
; month can take most of a second) the game draws frames from inside the simulation so the screen
; keeps moving: by default whenever your refresh rate's interval has passed, about every 11 ms at
; 90 Hz. Each costs as much as a normal frame. Here at most one per this many ms; 33 is about
; 30 per second. 0: the game's own rate. Larger is faster but choppier during long days.
in_tick_frame_ms=33
; 1: at the fastest speed, the game runs a day's 10 ticks in 2 frames instead of 5 (it normally
; runs 2 ticks per frame). Batches end at the AI's tick and at the day's tick, so the AI's and
; the day's commands still take effect before the next tick, as in the game. Single player only.
; 0: the game's 2 ticks per frame.
batch_ticks=1
; 1: fleet automation's pathfinding gets each answer to "how well can this empire detect that
; empire's cloaked fleets here" from a table built once per search, instead of the game scanning
; two lists for every fleet in every system it passes. Same answers; measured gain small. 0: off.
fast_intel_lookup=1
; 1: also run the game's own lookup every time, use the game's answer, and write any difference
; to stellaris-engine-fixes.log (slower than off; for checking). 0: no check.
fast_intel_verify=0
; 1: every tick the game records each fleet's combat participants in a table, even for the many
; fleets not in combat, whose record is empty. A missing record already reads as empty, so the
; empty ones are not stored. Same results, less work per tick. 0: off.
skip_empty_combat_entries=1
; 1: when an AI empire looks for a place to build a megastructure, it checks for every candidate
; system whether it can afford the megastructure; that answer doesn't depend on the system, so
; it is worked out once per search. Same results. 0: off.
mega_afford_cache=1
; 1: also run the game's check every time, use the game's answer, and write any difference to
; stellaris-engine-fixes.log (for checking). 0: no check.
mega_afford_verify=0
; 1: each AI month an AI empire sets its income targets by adding the income of its economic
; plan's "scaling" parts round after round until it passes a target, with no limit on the rounds.
; A very large economy can need a billion rounds, which freezes the game for half an hour (seen
; after switching to observe on a late-game save). Every round adds the same, so the number of
; rounds is worked out after the first instead. Same targets. 0: off.
fast_income_target=1
; 1: also let rounds 2 and 3 run and check they add what round 1 did, writing any difference to
; stellaris-engine-fixes.log (for checking). 0: no check.
income_target_verify=0
; 1: when the game looks for a file it tries every mod's folder in turn, and most of those fail
; because the folder doesn't exist in that mod. Those are answered from a listing of the mod's
; folders, read once, for a faster load. Same results. 0: off.
fast_file_lookups=1
; 1: also ask the file system every time, use its answer, and write any difference to
; stellaris-engine-fixes.log (for checking; no speed-up). 0: no check.
fast_file_lookups_verify=0
; 1: the game keeps a table of every script keyword's text, and refills all of it each time a new
; one appears while mods load. Only the new ones are added. Same table, faster load. 0: off.
fast_token_rebuild=1
; 1: also run the game's rebuild on every 16th call and write any difference to stellaris-engine-fixes.log
; (for checking; slower). 0: no check.
fast_token_rebuild_verify=0
; 1: every object the game destroys while loading searches a long list of references for entries
; of its own, and nearly all have none. Objects known to have none skip the search, for a faster
; load. Same results. 0: off.
fast_deferred_unregister=1
; 1: also check each skip against the list, and write any difference to stellaris-engine-fixes.log (for
; checking). 0: no check.
fast_deferred_unregister_verify=0
; 1: skip writing logs/script_documentation/modifiers.log, a list of modifiers for modders that
; takes seconds to write and nothing in the game reads. It stays empty. 0: write it.
skip_modifier_docs=1

[ai_fixes]
; Fixes for places where the AI's code disagrees with itself or its defines.
; Each changes how AI empires play, so each is off (0) unless set. None changes saves; they act on
; the AI only, so in multiplayer every player would need the same ones (untested).
; 1: the planet build plan the AI makes once a month lasts the month. The game uses it for one
; week, then deletes it, so AIs place planet buildings and districts one week in four. Items whose
; planet is already building something wait at the end of the plan instead of stopping it.
build_plan_keep=0
; 1: the "opportunist" personality trait ("more likely to attack someone already at war") counts
; the target's enemies in the target's wars. The game looks at the AI's own wars instead, so at
; peace the trait does nothing.
opportunist_wars=0
; 1: the war score's distance penalty counts the jumps above WAR_DECLARATION_MALUS_DISTANCE, as
; the define's comment says. The game multiplies the whole distance, so any target past it gets the
; minimum score.
war_distance_slope=0
; N: a truce with any country divides the AI's chance of preparing a war by N. The game divides by
; AI_AGGRESSIVENESS_BOXED_IN_MULT (4), a define meant for something else. 0: the game's.
truce_war_divisor=0
; 1: the AI's lists of systems to colonize, explore and claim are rebuilt every month, as in the
; first 15 years. The game rebuilds them once a year after that, so conquered systems go unnoticed
; for months and an AI that can no longer expand isn't treated as boxed in.
expansion_refresh_monthly=0
; 1: each AI's weekly, monthly and yearly updates fall on fixed days of the calendar, spread
; evenly. The game counts from the moment the AI object is created, so every load moves them, and
; two sevenths of the AIs' weekly updates share one day.
ai_schedule_from_date=0
; 1: a loaded AI continues the random stream saved with it. The game restarts it at the country's
; id unless started with -loadrandomseed (which also restores the game's own random). The log says
; how many AIs continue a saved stream on the first day after a load.
ai_random_from_save=0
